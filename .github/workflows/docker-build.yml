name: Build Custom to Docker Hub

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: 'Nhập Tag của mã nguồn (vd: v0.4.20)'
        required: true
        default: 'v0.4.20'
      image_tag:
        description: 'Nhập Tag cho Docker Image (vd: latest hoặc v1.0)'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_tag }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAME }}/models:${{ github.event.inputs.image_tag }}
            ${{ secrets.DOCKERHUB_NAME }}/models:latest
